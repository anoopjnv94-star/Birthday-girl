<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Kashish!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-size: 2.5rem;
      color: #fff;
      text-shadow: 0 0 10px #ff4081, 0 0 20px #ff4081, 0 0 30px #ff4081;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      0% { text-shadow: 0 0 10px #ff4081, 0 0 20px #ff4081, 0 0 30px #ff4081; color: #fff; }
      50% { text-shadow: 0 0 15px #ffd700, 0 0 25px #ffd700, 0 0 40px #ffd700; color: #ffe066; }
      100% { text-shadow: 0 0 15px #00e5ff, 0 0 25px #00e5ff, 0 0 40px #00e5ff; color: #b3f0ff; }
    }
    .message {
      font-size: 1.2rem;
      color: #fff;
      margin-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background: #ff4081;
      color: #fff;
      cursor: pointer;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .balloon {
      position: absolute;
      bottom: -100px;
      width: 40px;
      height: 60px;
      background: red;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: floatUp 10s linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div>
    <h1>🎉 Happy Birthday, Kashish! 🎂</h1>
    <p class="message">Wishing you joy, love, and endless celebrations!</p>
    <button onclick="toggleMusic()">🎵 Play Birthday Song</button>
  </div>
  <canvas id="confetti"></canvas>
  <canvas id="fireworks"></canvas>
  <audio id="song" src="birthday.mp3"></audio> <!-- Add your birthday.mp3 file -->

  <script>
    // Confetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const confettiPieces = [];
    const colors = ['#FFC107', '#FF5722', '#4CAF50', '#2196F3', '#9C27B0'];

    function ConfettiPiece() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height - canvas.height;
      this.size = Math.random() * 8 + 2;
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.speed = Math.random() * 3 + 2;
    }

    ConfettiPiece.prototype.update = function() {
      this.y += this.speed;
      if (this.y > canvas.height) {
        this.y = -10;
        this.x = Math.random() * canvas.width;
      }
    };

    ConfettiPiece.prototype.draw = function() {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    };

    function initConfetti() {
      for (let i = 0; i < 150; i++) {
        confettiPieces.push(new ConfettiPiece());
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiPieces.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateConfetti);
    }

    initConfetti();
    animateConfetti();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      fireworksCanvas.width = window.innerWidth;
      fireworksCanvas.height = window.innerHeight;
    });

    // Balloons
    function createBalloon() {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      balloon.style.left = Math.random() * window.innerWidth + 'px';
      balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
      document.body.appendChild(balloon);
      setTimeout(() => balloon.remove(), 10000);
    }
    setInterval(createBalloon, 2000);

    // Fireworks
    const fireworksCanvas = document.getElementById('fireworks');
    const fctx = fireworksCanvas.getContext('2d');
    fireworksCanvas.width = window.innerWidth;
    fireworksCanvas.height = window.innerHeight;

    function Firework(x, y) {
      this.x = x;
      this.y = y;
      this.particles = [];
      for (let i = 0; i < 50; i++) {
        this.particles.push({
          x: x,
          y: y,
          angle: Math.random() * 2 * Math.PI,
          speed: Math.random() * 5 + 2,
          radius: Math.random() * 2 + 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 100
        });
      }
    }

    Firework.prototype.update = function() {
      this.particles.forEach(p => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.life--;
      });
    };

    Firework.prototype.draw = function() {
      this.particles.forEach(p => {
        if (p.life > 0) {
          fctx.fillStyle = p.color;
          fctx.beginPath();
          fctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          fctx.fill();
        }
      });
    };

    const fireworks = [];
    function animateFireworks() {
      fctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      fireworks.forEach((fw, i) => {
        fw.update();
        fw.draw();
        if (fw.particles.every(p => p.life <= 0)) {
          fireworks.splice(i, 1);
        }
      });
      requestAnimationFrame(animateFireworks);
    }

    setInterval(() => {
      fireworks.push(new Firework(Math.random() * fireworksCanvas.width, Math.random() * fireworksCanvas.height / 2));
    }, 2000);

    animateFireworks();

    // Music toggle
    function toggleMusic() {
      const song = document.getElementById('song');
      if (song.paused) {
        song.play();
      } else {
        song.pause();
      }
    }
  </script>
</body>
</html>
